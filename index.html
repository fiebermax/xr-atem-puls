<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>XR Atem und Puls</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sky color="#1B2A33"></a-sky>
      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="directional" intensity="0.5" position="-1 2 1"></a-light>

      <a-circle position="0 0 -2" rotation="-90 0 0" radius="3" color="#12202A"></a-circle>
      <a-box position="0 1.5 -2" width="0.6" height="0.6" depth="0.6" color="#4CC3D9"></a-box>

      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
