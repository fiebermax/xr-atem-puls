<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>XR Atem und Puls</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }

      /* Randabdunklung. Nur am Bildschirm sichtbar, im Headset nicht,
         weil DOM-Overlays dort nicht gerendert werden. */
      #vignette {
        position: fixed; inset: 0; z-index: 5; pointer-events: none;
        background: radial-gradient(ellipse at center,
                    rgba(0,0,0,0) 42%, rgba(0,0,0,0.5) 100%);
      }

      #pulsanzeige {
        position: fixed; top: 18px; left: 18px; z-index: 10;
        background: rgba(12,24,28,0.55);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.14);
        color: #e6f0f2;
        padding: 8px 16px; border-radius: 999px; font-size: 15px;
        font-variant-numeric: tabular-nums;   /* Zahl zappelt nicht beim Wechsel */
        letter-spacing: 0.02em;
      }

      /* Statusanzeige oben rechts: laeuft die Live Simulation gerade?
         Ist zugleich Schalter, damit sie nicht nur meldet, sondern auch
         schaltet. Der Punkt links traegt den Zustand. */
      #live-status {
        position: fixed; top: 18px; right: 18px; z-index: 10;
        display: flex; align-items: center; gap: 9px;
        background: rgba(12,24,28,0.55);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.14);
        color: #e6f0f2;
        padding: 8px 16px; border-radius: 999px;
        font: inherit; font-size: 15px; cursor: pointer;
        transition: border-color 0.25s;
      }

      #live-status:hover { border-color: rgba(255,255,255,0.34); }

      #live-status::before {
        content: ''; width: 9px; height: 9px; border-radius: 50%;
        background: #6B7B84;                       /* aus */
        transition: background 0.25s, box-shadow 0.25s;
      }

      #live-status.an::before {
        background: #2E9E6B;                       /* an */
        box-shadow: 0 0 0 3px rgba(46,158,107,0.25);
      }

      #live-status.stoerung::before { background: #C4703A; }
      #live-status.stoerung { border-color: #C4703A; color: #F0B080; }

      #bedienleiste {
        position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
        z-index: 10; display: flex; gap: 8px;
      }

      #bedienleiste button {
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(12,24,28,0.55);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        color: #e6f0f2;
        padding: 9px 20px; border-radius: 999px; font-size: 15px; cursor: pointer;
        transition: background 0.25s, border-color 0.25s, color 0.25s;
      }

      #bedienleiste button:hover { border-color: rgba(255,255,255,0.34); }

      #bedienleiste button.aktiv { background: #2E9E6B; color: #fff; border-color: #2E9E6B; }

      /* Bei Wiedergabe aus der Datei ohne Funktion. Die aktiv-Markierung
         bleibt sichtbar, die Buttons zeigen dann nur noch den Zustand an. */
      #bedienleiste button:disabled {
        opacity: 0.45; cursor: not-allowed;
      }

      #bedienleiste button:disabled:hover { border-color: rgba(255,255,255,0.16); }

      /* Umschalter etwas absetzen, er gehoert nicht zur Zustandssteuerung */
      #btn-live { margin-left: 12px; }

      /* Datei nicht ladbar: sichtbar machen statt nur in der Konsole melden */
      #btn-live.stoerung {
        background: rgba(12,24,28,0.55); border-color: #C4703A; color: #F0B080;
      }

      #startbildschirm {
        position: fixed; inset: 0; z-index: 20;
        background: #0E1F22; color: #fff;   /* wie der untere Rand des Himmels */
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px;
        transition: opacity 0.8s ease;
      }

      /* Weiches Ausblenden statt hartem Sprung in die Szene */
      #startbildschirm.weg { opacity: 0; pointer-events: none; }

      #startbildschirm h1 { font-size: 26px; font-weight: 600; margin: 0; }
      #startbildschirm p  { color: #b8c4cc; margin: 0 0 14px 0; }

      #startbildschirm button {
        border: none; background: #2E9E6B; color: #fff;
        padding: 10px 28px; border-radius: 16px; font-size: 16px; cursor: pointer;
      }

      .versteckt { display: none !important; }
    </style>
  </head>

  <body>
    <!-- Frame 0: Startbildschirm -->
    <div id="startbildschirm">
      <h1>Atem und Puls</h1>
      <p>Ein Lungenmodell atmet im Rhythmus des simulierten Pulses.</p>
      <button id="btn-los">Start</button>
    </div>

    <div id="vignette"></div>

    <!-- Overlay: Pulsanzeige und Bedienleiste -->
    <div id="pulsanzeige" class="versteckt">– bpm</div>

    <button id="live-status" class="versteckt">Live Simulation: aus</button>

    <div id="bedienleiste" class="versteckt">
      <button id="btn-startstopp">Stopp</button>
      <button id="btn-ruhe" class="aktiv">Ruhe</button>
      <button id="btn-anspannung">Anspannung</button>
      <button id="btn-live">Live Simulation</button>
    </div>

    <!-- XR-Szene -->
    <a-scene>
      <a-assets>
        <a-asset-item id="lunge" src="models/lunge.glb"></a-asset-item>
      </a-assets>

      <!-- Himmelskugel mit Farbverlauf. Kein a-sky, weil dessen
           Standardfarbe nicht zum eigenen Shader passt. -->
      <a-entity id="himmel"
                geometry="primitive: sphere; radius: 400; segmentsWidth: 32; segmentsHeight: 24"
                material="shader: verlauf; side: back"
                himmel-puls></a-entity>

      <!-- Die Helligkeit schreibt atem-licht in jedem Bild neu,
           der Wert hier ist nur der Ausgangspunkt. -->
      <a-light type="ambient" intensity="0.6" atem-licht></a-light>
      <a-light type="directional" intensity="0.5" position="-1 2 1"></a-light>

      <!-- Boden. Neutral gehalten, damit er zur kuehlen wie zur
           warmen Himmelsfarbe passt. -->
      <a-circle position="0 0 -2" rotation="-90 0 0" radius="3" color="#141B1E"></a-circle>

      <!-- Atemfuehrung: waechst und leuchtet im Takt des Modells. Zwei
           Zentimeter ueber dem Boden, sonst flimmern die beiden Flaechen
           gegeneinander. -->
      <a-ring id="atemring" position="0 0.02 -2" rotation="-90 0 0"
              radius-inner="0.60" radius-outer="0.66"
              material="shader: flat; color: #3E8E7E; transparent: true; opacity: 0.3"
              atem-ring></a-ring>

      <!-- Aeusserer Container wird skaliert, inneres Modell wird zentriert -->
      <a-entity id="lungenmodell" position="0 1.5 -2" atmung>
        <a-entity id="lunge-inner"
                  gltf-model="#lunge"
                  modell-fix="zielhoehe: 1.47"></a-entity>
      </a-entity>

      <!-- Die Hoehe wirkt nur am Bildschirm. In VR ersetzt WebXR die
           Kamerapose durch die Headset-Position ueber dem Boden. -->
      <a-camera position="0 1.54 0"></a-camera>
    </a-scene>

    <!-- Schnittstelle und Umschalter zuerst, danach die Quellen -->
    <script src="js/datenquelle.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/aufzeichnung.js"></script>
    <script src="js/modell-fix.js"></script>
    <script src="js/atmung.js"></script>
    <script src="js/himmel.js"></script>
    <script src="js/atem-echo.js"></script>
    <script src="js/ui.js"></script>
  </body>
</html>
